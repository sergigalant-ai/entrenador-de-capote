<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrenador de Capote</title>
<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
}

#game{
  width:100%;
  min-height:100vh;
  position:relative;
  overflow:hidden;
}
  

h1{
  margin:15px 0;
}
  #info{
  font-size:20px;
  font-weight:bold;
}

#mensaje{
  font-size:22px;
  margin:15px;
}

button{
  padding:15px 30px;
  font-size:22px;
  border:0;
  border-radius:30px;
  background:red;
  color:white;
  font-weight:bold;
}
  #camara{
  width:90%;
  max-width:500px;
  margin-top:20px;
}

#toro{
  position:absolute;
  font-size:70px;
  left:10%;
  top:60%;
}
</style>
</head>
<body>

<div id="game">

<h1>🐂 Entrenador de Capote</h1>

<div id="info">
Puntos: <span id="score">0</span>
&nbsp;&nbsp;
Racha: <span id="racha">0</span>
</div>

<div id="mensaje">
Pulsa EMPEZAR y usa tu capote rojo
</div>
<button id="empezar">EMPEZAR</button>

<br>

<video id="camara" autoplay playsinline></video>

<div id="toro">🐂</div>

</div>

<script>
  const boton=document.getElementById("empezar");
const mensaje=document.getElementById("mensaje");
const camara=document.getElementById("camara");
const scoreEl=document.getElementById("score");
const rachaEl=document.getElementById("racha");
const toro=document.getElementById("toro");
let score=0;
let racha=0;
let jugando=false;
boton.onclick=async function(){
  if(jugando)return;
try{ const stream=await navigator.mediaDevices.getUserMedia({ video:true });
camara.srcObject=stream; jugando=true; boton.style.display="none"; mensaje.textContent="🟢 ¡FUNCIONANDO! Busca tu capote rojo"; detectarCapote();
}catch(error){ mensaje.textContent="❌ No se pudo activar la cámara"; } };
function detectarCapote(){
if(!jugando)return;
const canvas=document.createElement("canvas"); const ctx=canvas.getContext("2d");
canvas.width=100; canvas.height=75;
ctx.drawImage(camara,0,0,100,75);
const datos=ctx.getImageData(0,0,100,75).data;
let rojos=0;
for(let i=0;i<datos.length;i+=4){
const r=datos[i];
const g=datos[i+1];
const b=datos[i+2];

if(r>100 && r>g*1.05 && r>b*1.05){
  rojos++;
}
}
const porcentaje=Math.round(rojos/(100*75)*100);
if(porcentaje>=5){
mensaje.textContent="🔴 ¡CAPOTE DETECTADO! "+porcentaje+"%";

score++;
racha++;

scoreEl.textContent=score;
rachaEl.textContent=racha;
  setTimeout(()=>{
  detectarCapote();
},1000);

return;
}else{
mensaje.textContent="🔎 Buscando capote... "+porcentaje+"%";
}
requestAnimationFrame(detectarCapote); }  
</script>
</body>
</html>
